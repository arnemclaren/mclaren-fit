<style>
/* Layout: eine Spalte, oben Kopf, unten drei Tabs in Daumennähe; im Training nur Liste + Pausenleiste.
   Dunkel zuerst (Studio-Licht), ein Signal-Orange nur für die Hauptaktion und die laufende Pause.
   Fotos als Graphit-Duoton, damit alte Übungsfotos ruhig und einheitlich wirken. */
:root {
  --bg: #0D0E10;
  --surface: #17191C;
  --raised: #202328;
  --fg: #F3F4F6;
  --muted: #8C929B;

  --good-soft: rgba(63,203,134,.13);
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F1F2F4; --surface: #FFFFFF; --raised: #F6F7F8; --fg: #121417; --muted: #626973; --line: #E1E3E6;
    --accent: #E8540F; --accent-ink: #FFFFFF; --accent-soft: rgba(232,84,15,.10); --good: #17834F; --good-soft: rgba(23,131,79,.10);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
[hidden] { display: none !important; }
.vh { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
label.cta, label.ghostbtn, label.li { cursor: pointer; }
.field textarea { min-height: 140px; resize: vertical; font-size: 14px; font-family: ui-monospace, monospace; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#app { max-width: 600px; margin-inline: auto; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.display { font-family: var(--font-display); font-style: italic; font-weight: 850; font-stretch: 88%; letter-spacing: -.015em; line-height: 1.02; text-wrap: balance; margin: 0; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* Kopf */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; }
.head h1 { font-size: 2.1rem; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--fg); background: var(--surface); flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); }

/* Fotos */
.ph { position: relative; overflow: hidden; background: var(--raised); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08) brightness(.95); }
.ph .b { animation: flip 2.6s infinite; }
@keyframes flip { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ph .b { animation: none; opacity: 0; } }
.ph.color img { filter: none; }
.hero .ph .ini, .media .ini { display: none; }
.hero .ph:not(:has(img)) { background: radial-gradient(120% 90% at 80% 10%, rgba(255,106,43,.35), transparent 60%), var(--raised); }
.ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font: italic 850 1.3rem var(--font-display); color: var(--muted); }
.thumb { width: 56px; height: 56px; border-radius: 12px; flex: none; }

/* Hero */
.hero { overflow: hidden; border-radius: 22px; min-height: 340px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; color: #fff; isolation: isolate; }

.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 1.05rem; }
.hero .cta { margin-top: 18px; }
.ghostbtn { min-height: 48px; border-radius: 14px; background: var(--surface); font-weight: 600; padding-inline: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.textbtn { color: var(--accent); font-weight: 700; min-height: 44px; padding-inline: 4px; }

/* Woche */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--surface); border-radius: 18px; padding: 14px 10px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
.wd i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); font-style: normal; }
.wd.done i { background: var(--good); color: #062014; }

.wd.today i { box-shadow: inset 0 0 0 2px var(--accent); }

/* Karten-Streifen */
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.dcard { scroll-snap-align: start; flex: 0 0 150px; border-radius: 16px; overflow: hidden; background: var(--surface); text-align: left; }
.dcard .ph { height: 96px; }
.dcard div.t { padding: 10px 12px 12px; }
.dcard b { display: block; font-size: .95rem; line-height: 1.2; }

/* Listen */
.list { background: var(--surface); border-radius: 18px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; width: 100%; text-align: left; min-height: 64px; }
.li + .li { border-top: 1px solid var(--line); }
.li b { display: block; font-weight: 650; line-height: 1.25; }
.li .s { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.chev { color: var(--muted); }

/* Training */
body.training { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.tbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding-block: 10px; margin-inline: -16px; padding-inline: 16px; }
body.training::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.tbar .mid { text-align: center; }
.tbar .mid b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
.finish { background: var(--accent); color: var(--accent-ink); font-weight: 800; border-radius: 999px; padding: 0 16px; min-height: 38px; }
.prog { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
.prog i { display: block; height: 100%; background: var(--good); transition: width .3s; }
.exb { background: var(--surface); border-radius: 18px; padding: 12px 12px 6px; }
.exb + .exb { margin-top: 12px; }
.exh { display: flex; align-items: center; gap: 12px; }
.exh .nm { flex: 1; min-width: 0; text-align: left; }
.exh .nm b { display: block; font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
.exh .nm span { font-size: .84rem; color: var(--muted); }
.up { color: var(--accent); font-weight: 700; }
.note { margin: 8px 0 0; font-size: .86rem; color: var(--muted); background: var(--raised); padding: 6px 10px; border-radius: 10px; }
.sets { display: grid; grid-template-columns: 30px minmax(0,1fr) 68px 58px 46px; gap: 6px 6px; align-items: center; margin-top: 10px; }
.sets .h { font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; padding-bottom: 2px; }
.sets .n { text-align: center; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.sets .prev { text-align: center; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { width: 100%; min-width: 0; height: 44px; border: 0; border-radius: 10px; background: var(--raised); text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cell::placeholder { color: var(--muted); font-weight: 500; }
.ck { width: 46px; height: 44px; border-radius: 10px; background: var(--raised); display: grid; place-items: center; color: var(--muted); }
.srow-done .cell, .srow-done .ck { background: var(--good-soft); }
.srow-done .ck { background: var(--good); color: #062014; }
.addset { width: 100%; min-height: 44px; margin-top: 4px; color: var(--muted); font-weight: 600; font-size: .92rem; }

/* Pause */
.rest { position: fixed; inset-inline: 0; bottom: 0; z-index: 9; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.restin { max-width: 600px; margin-inline: auto; background: var(--raised); border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position: relative; overflow: hidden; }
.restin .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); transition: width .25s linear; }
.restin > *:not(.fill) { position: relative; }
.restin .t { font: italic 850 2.2rem/1 var(--font-display); font-stretch: 80%; font-variant-numeric: tabular-nums; min-width: 3.6ch; }
.restin .pill { min-width: 50px; height: 40px; border-radius: 12px; background: var(--surface); font-weight: 700; font-size: .9rem; }
.rest.over .restin { background: var(--accent); color: var(--accent-ink); }
.rest.over .pill { background: rgba(0,0,0,.15); }

/* Tabs */
nav.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
nav.tabs .in { display: flex; max-width: 600px; margin-inline: auto; }
nav.tabs button { flex: 1; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.resume { position: fixed; inset-inline: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding-inline: max(12px, env(safe-area-inset-left, 0px)); }
.resume button { max-width: 600px; margin-inline: auto; display: flex; width: 100%; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 12px 16px; font-weight: 800; text-align: left; }

/* Sheet */
.sbg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { font-size: 1.7rem; }
.sheet .full { margin-inline: -16px; margin-top: -8px; }
.media { aspect-ratio: 3 / 2; max-width: 100%; border-radius: 0; }
.media img { filter: none; }
.menu .li { min-height: 54px; font-weight: 600; }
.search { width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--surface); padding: 0 14px; font-size: 17px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.stepper .v { font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; min-width: 5ch; white-space: nowrap; text-align: center; }
.stepper button { width: 44px; height: 44px; border-radius: 10px; background: var(--raised); font-size: 1.3rem; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; min-height: 46px; border: 0; border-radius: 12px; background: var(--surface); padding: 10px 14px; font-size: 17px; }
.cues { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 4px; }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(240,180,40,.16); color: #E9B949; vertical-align: 2px; }
.tag.good { background: var(--good-soft); color: var(--good); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px; }
.tile .v { font: italic 850 1.9rem/1 var(--font-display); font-stretch: 82%; font-variant-numeric: tabular-nums; margin-top: 6px; }
.panel { background: var(--surface); border-radius: 18px; padding: 14px; }
.chart text { fill: var(--muted); font: 600 11px var(--font-body); }
.mbar { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; font-size: .88rem; }

.mbar .track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; font-size: 1.05rem; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: italic 850 1.15rem var(--font-display); flex: none; }
.avatar.big { width: 72px; height: 72px; font-size: 2rem; }

.boost span { font-size: .85rem; color: var(--muted); }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.cal .dh { font-size: .68rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.cal .dc { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--raised); }
.cal .dc.on { background: var(--accent); color: var(--accent-ink); }
.cal .dc.k { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); color: var(--fg); }
.cal .dc.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.cal .dc.blank { background: none; }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--accent); }
.legend i.k { background: none; box-shadow: inset 0 0 0 2px var(--accent); }
.tile .ti { color: var(--accent); display: block; margin-bottom: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 2px; }
.wrow { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: .92rem; }
.wrow:first-child { border-top: 0; }
.delta { color: var(--good); font-weight: 700; }
.celebrate { text-align: center; padding: 6px 0 16px; }
.celebrate .bi { width: 64px; height: 64px; border-radius: 22px; margin: 0 auto 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.celebrate p { margin: 6px auto 0; max-width: 34ch; color: var(--muted); }
.prof { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.li .lic { width: 36px; height: 36px; border-radius: 10px; background: var(--raised); display: grid; place-items: center; color: var(--muted); flex: none; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s cubic-bezier(.2,.8,.2,1); } @keyframes up { from { transform: translateY(40px); opacity: .5; } } }
</style>

      case "tab": S.tab = v; render(); window.scrollTo(0, 0); break;
      case "resume": S.tab = "training"; keepAwake(true); render(); break;
      case "minimize": S.tab = "heute"; render(); break;
      case "preview": open({ type: "preview", did: v }); break;
      case "start": start(findDay(v)); break;
      case "startk": start(findDay(v), "kompakt"); toast("Kompakt: 4 Übungen, je 2 Sätze. Hauptsache da."); break;
      case "calprev": S.calMonth = (S.calMonth || 0) - 1; render(); break;
      case "calnext": S.calMonth = Math.min(0, (S.calMonth || 0) + 1); render(); break;
      case "pname": textCb = function (val) { if (val) S.profile.name = val; put("profile", S.profile); render(); open({ type: "settings" }); }; open({ type: "text", title: "Name", label: "Dein Name", value: S.profile.name, back: { type: "settings" } }); break;
      case "pgoal": textCb = function (val) { if (val) S.profile.goal = val; put("profile", S.profile); render(); open({ type: "settings" }); }; open({ type: "text", title: "Dein Ziel", label: "Wofür trainierst du?", value: S.profile.goal, back: { type: "settings" } }); break;
      case "startfree": start(null); break;
      case "setdone":
        var e0 = A.entries[ei], st = e0.sets[si];
        if (!st.done) {
          var wv = n(st.w), rv = n(st.r);
          st.w = wv == null ? e0.pw : wv; st.r = rv == null ? e0.pr : rv; st.done = true;
          if (st.w != null) e0.pw = st.w;
          var last = ei === A.entries.length - 1 && e0.sets.every(function (x) { return x.done; });
          if (!last) startRest(e0.rest); else { S.timer = null; }
        } else st.done = false;
        unlock(); saveActive(true); render(); break;
      case "addset": A.entries[ei].sets.push({ w: null, r: null, done: false }); saveActive(); render(); break;
      case "exmenu":
        var E = A.entries[ei];
        menu([
          { label: "Übung tauschen", fn: function () { pickCb = function (id) { var ne = entry({ ex: id, s: E.sets.length, r: E.pr, rest: E.rest }); A.entries[ei] = ne; saveActive(); shut(); render(); }; open({ type: "picker", swapOf: E.ex, mf: ex(E.ex).m }); } },
          { label: S.notes[E.ex] ? "Notiz ändern" : "Notiz hinzufügen", fn: function () { noteFor(E.ex); } },
          E.sets.length > 1 ? { label: "Letzten Satz entfernen", fn: function () { E.sets.pop(); saveActive(); shut(); render(); } } : null,
          ei > 0 ? { label: "Nach oben schieben", fn: function () { var t2 = A.entries[ei - 1]; A.entries[ei - 1] = E; A.entries[ei] = t2; saveActive(); shut(); render(); } } : null,
          { label: "Übung entfernen", danger: true, fn: function () { A.entries.splice(ei, 1); saveActive(); shut(); render(); } }
        ].filter(Boolean)); break;
      case "menupick": var it0 = menuCb[+v]; if (it0) it0.fn(); break;
      case "addex": pickCb = function (id) { A.entries.push(entry({ ex: id, s: 3, r: 10 })); saveActive(); shut(); render(); }; open({ type: "picker" }); break;
      case "finishask": open({ type: "finish" }); break;
      case "finish": finish(); break;
      case "discardask": S.confirm = "discard"; renderSheet(); break;
      case "discard": S.active = null; S.timer = null; keepAwake(false); saveActive(true); S.tab = "heute"; shut(); render(); toast("Training verworfen"); break;
      case "noconfirm": S.confirm = null; renderSheet(); break;
      case "rest": if (S.timer) { S.timer.end += (+v) * 1000; S.timer.total = Math.max(S.timer.total, (S.timer.end - Date.now()) / 1000); S.timer.beeped = false; tick(); } break;
      case "restskip": S.timer = null; if (A) A.timer = null; renderFloat(); break;
      case "exinfo": open({ type: "exinfo", id: v, back: s && s.type === "preview" ? s : null }); break;
      case "note": noteFor(v); break;
      case "wopen": open({ type: "workout", id: v }); break;
      case "wdelask": S.confirm = "wdel"; renderSheet(); break;
      case "wdel": S.workouts = S.workouts.filter(function (w) { return w.id !== v; }); put("workouts", S.workouts); shut(); render(); toast("Training gelöscht"); break;
      case "close": if (s && s.back) open(s.back); else shut(); break;
      case "mf": S.mf = S.mf === v ? "" : v; renderSheet(); var pq = $("pq"); if (pq) pq.value = S.q; break;
      case "picked": if (pickCb) pickCb(v); break;
      case "customnew": open({ type: "custom" }); break;
      case "customsave": var nm = $("c-n").value.trim(); if (!nm) { $("c-n").focus(); break; }
        var ce = { id: "eigen-" + uid(), n: nm, m: $("c-m").value, t: $("c-t").value, eq: "Eigene" }; S.custom.push(ce); put("custom", S.custom); buildExMap(); if (pickCb) pickCb(ce.id); break;
      case "textsave": if (textCb) textCb($("tx").value.trim()); break;
      case "bwadd": textCb = function (val) { var x = n(val); if (x && x > 30 && x < 300) { S.body.push({ t: Date.now(), kg: x }); put("body", S.body); shut(); render(); toast("Gewicht eingetragen"); } };
        open({ type: "text", title: "Körpergewicht", label: "Gewicht in kg", num: true, ph: S.body.length ? kg(S.body[S.body.length - 1].kg) : "z. B. 100" }); break;
      /* Plan */
      case "settings": open({ type: "settings" }); break;
      case "export": exportData(); break;
      case "import": $("importfile").click(); break;
      case "paste": open({ type: "paste", back: { type: "settings" } }); break;
      case "pastesave": var txt = $("pastetx").value.trim(); if (!readBackup(txt)) toast("Text nicht erkannt. Bitte den ganzen Dateiinhalt einfügen."); break;
      case "plandelask": S.confirm = "plandel"; renderSheet(); break;
      case "plandel": var pdel = plan(); S.plans.list = S.plans.list.filter(function (x) { return x !== pdel; }); S.plans.active = (S.plans.list[0] || {}).id || null; savePlans(); shut(); render(); toast("Plan gelöscht"); break;
      case "importok": applyImport(); break;
      case "planact": S.plans.active = v; savePlans(); render(); break;
      case "planadd": textCb = function (val) { var p = { id: uid(), name: val || "Neuer Plan", days: [] }; S.plans.list.push(p); S.plans.active = p.id; savePlans(); shut(); render(); }; open({ type: "text", title: "Neuer Plan", label: "Name" }); break;
      case "planrename": var pp = plan(); textCb = function (val) { if (val) pp.name = val; savePlans(); shut(); render(); }; open({ type: "text", title: "Plan umbenennen", label: "Name", value: pp.name }); break;
      case "dayadd": textCb = function (val) { var nd = { id: uid(), name: val || "Neuer Tag", wd: null, items: [] }; plan().days.push(nd); savePlans(); render(); open({ type: "day", did: nd.id }); }; open({ type: "text", title: "Neuer Trainingstag", label: "Name", ph: "z. B. Oberkörper" }); break;
      case "dayedit": open({ type: "day", did: v }); break;
      case "daymenu":
        var dd = findDay(s.did), did = s.did;
        menu([
          { label: "Umbenennen", fn: function () { textCb = function (val) { if (val) dd.name = val; savePlans(); render(); open({ type: "day", did: did }); }; open({ type: "text", title: "Tag umbenennen", label: "Name", value: dd.name }); } },
          { label: "Wochentag festlegen", fn: function () { menu([1,2,3,4,5,6,0].map(function (k) { return { label: WDL[k], fn: function () { dd.wd = k; savePlans(); render(); open({ type: "day", did: did }); } }; }).concat([{ label: "Kein fester Tag", fn: function () { dd.wd = null; savePlans(); render(); open({ type: "day", did: did }); } }])); } },
          { label: "Tag löschen", danger: true, fn: function () { open({ type: "day", did: did }); S.confirm = "daydel"; renderSheet(); } }
        ]); break;
      case "daydel": var p3 = plan(); p3.days = p3.days.filter(function (d) { return d.id !== s.did; }); savePlans(); shut(); render(); break;
      case "dayaddex": var did2 = s.did; pickCb = function (id) { findDay(did2).items.push({ ex: id, s: 3, r: 10, rest: ex(id).t === "kraft" ? 90 : 60 }); savePlans(); render(); open({ type: "day", did: did2 }); }; open({ type: "picker" }); break;
      case "itemedit": open({ type: "item", did: s.did, i: +v }); break;
      case "backday": open({ type: "day", did: s.did }); render(); break;
      case "step":
        var k = t.getAttribute("data-k"), dv = +v;
        if (k.indexOf("set-") === 0) { var sk = k.slice(4), lim = { rest: [15, 600], weekGoal: [1, 7], budget: [15, 180] }[sk]; S.settings[sk] = Math.min(lim[1], Math.max(lim[0], S.settings[sk] + dv)); put("settings", S.settings); renderSheet(); break; }
        var itm = findDay(s.did).items[s.i], base = itm[k] || (k === "rest" ? S.settings.rest : k === "s" ? 3 : 10);
        itm[k] = Math.max(k === "rest" ? 15 : 1, base + dv); savePlans(); renderSheet(); break;
      case "itemswap": var c2 = { did: s.did, i: s.i }, cur = findDay(s.did).items[s.i];
        pickCb = function (id) { var x = findDay(c2.did).items[c2.i]; x.ex = id; x.n = ""; x.wOld = null; x.u = ""; savePlans(); render(); open({ type: "item", did: c2.did, i: c2.i }); }; open({ type: "picker", swapOf: cur.ex, mf: ex(cur.ex).m }); break;
      case "itemup": var arr = findDay(s.did).items, tmp = arr[s.i - 1]; arr[s.i - 1] = arr[s.i]; arr[s.i] = tmp; savePlans(); render(); open({ type: "item", did: s.did, i: s.i - 1 }); break;
      case "itemrename": var c3 = { did: s.did, i: s.i }, x3 = findDay(s.did).items[s.i]; textCb = function (val) { x3.n = val; savePlans(); render(); open({ type: "item", did: c3.did, i: c3.i }); }; open({ type: "text", title: "Anzeigename", label: "Name", value: x3.n || "", ph: ex(x3.ex).n }); break;
      case "itemdel": findDay(s.did).items.splice(s.i, 1); savePlans(); open({ type: "day", did: s.did }); render(); toast("Übung entfernt"); break;
    }
  });
  function noteFor(id) { textCb = function (val) { if (val) S.notes[id] = val; else delete S.notes[id]; put("notes", S.notes); shut(); render(); }; open({ type: "text", title: "Notiz", label: ex(id).n, value: S.notes[id] || "", ph: "z. B. Sitzhöhe 4, Griff eng" }); }
  document.addEventListener("input", function (ev) {
    var t = ev.target, k = t.getAttribute("data-in"); if (!k) return;
    if (k === "w" || k === "r") { S.active.entries[+t.getAttribute("data-e")].sets[+t.getAttribute("data-s")][k] = t.value === "" ? null : t.value; saveActive(); }
    else if (k === "q") { S.q = t.value; $("plist").innerHTML = pickList(S.sheet); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target.id === "tx" && textCb) { ev.preventDefault(); textCb(ev.target.value.trim()); } });

  /* ---------- Backup ---------- */
  function exportData() {
    var data = { app: "mclaren-fit", v: 2, date: new Date().toISOString(), plans: S.plans, custom: S.custom, settings: S.settings, workouts: S.workouts, body: S.body, notes: S.notes, profile: S.profile };
    var name = "mclaren-fit-backup-" + new Date().toISOString().slice(0, 10) + ".json", blob = new Blob([JSON.stringify(data)], { type: "application/json" }), file = null;
    try { file = new File([blob], name, { type: "application/json" }); } catch (e) {}
    var done = function () { S.lastBackup = Date.now(); put("lastBackup", S.lastBackup); render(); toast("Backup gespeichert"); };
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: "McLaren-Fit Backup" }).then(done).catch(function () {});
    else { var l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = name; document.body.appendChild(l); l.click(); l.remove(); done(); }
  }
  $("importfile").addEventListener("change", function (ev) {
    var f = ev.target.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () { if (!readBackup(String(r.result || ""))) toast("Diese Datei ist kein McLaren-Fit-Backup."); ev.target.value = ""; };
    r.onerror = function () { toast("Datei konnte nicht gelesen werden."); ev.target.value = ""; };
    r.readAsText(f);
  });
  function readBackup(txt) {
    var d; try { d = JSON.parse(txt.replace(/^\uFEFF/, "")); } catch (e) { return false; }
    if (!d || !d.plans || !Array.isArray(d.plans.list)) return false;
    S.pendingImport = d;
    if (!S.workouts.length) { applyImport(); return true; }  /* noch keine eigenen Trainings: nichts zu verlieren, direkt laden */
    open({ type: "settings" }); S.confirm = "import"; renderSheet(); return true;
  }
  function applyImport() {
    var d = S.pendingImport; if (!d) return;
    S.plans = d.plans; if (!S.plans.active && S.plans.list[0]) S.plans.active = S.plans.list[0].id; S.custom = d.custom || []; S.settings = Object.assign({ rest: 90, weekGoal: 5, budget: 50 }, d.settings || {}); S.workouts = d.workouts || []; S.body = d.body || []; S.notes = d.notes || {}; S.profile = d.profile || S.profile;
    ["plans","custom","settings","workouts","body","notes","profile"].forEach(function (k) { put(k, S[k]); });
    S.pendingImport = null; S.tab = "heute"; shut(); render(); toast("Geladen: " + S.plans.list.length + (S.plans.list.length === 1 ? " Plan" : " Pläne") + ", " + S.workouts.length + " Trainings");
  }

  /* ---------- Start ---------- */
  function boot() {
    S.plans = get("plans", null); if (!S.plans) { S.plans = clone(window.DEFAULT_PLANS); savePlans(); }
    S.custom = get("custom", []); S.settings = Object.assign({ rest: 90, weekGoal: 5, budget: 50 }, get("settings", {}));
    S.workouts = get("workouts", []); S.body = get("body", []); S.notes = get("notes", {}); S.lastBackup = get("lastBackup", null); S.profile = Object.assign({ name: "Arne", goal: "Fitter und muskulöser werden" }, get("profile", {}));
    S.active = get("active", null);
    if (S.active) { S.tab = "training"; S.timer = S.active.timer && S.active.timer.end > Date.now() - 60000 ? S.active.timer : null; keepAwake(true); }
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    render();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  }
  boot();
})();
